<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .rise { animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both }
    .rise2 { animation: rise 1.2s .25s cubic-bezier(.2,.7,.2,1) both }
    .grow { transform-origin: 600px 0; animation: grow 1.6s cubic-bezier(.2,.7,.2,1) both }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect y="120" width="1200" height="180" fill="url(#glow)"/>
  <text class="rise" x="600" y="138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#f9fafb" letter-spacing="-1.5">Fábio Matheus</text>
  <text class="rise2" x="600" y="186" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="22" fill="#9ca3af">Infraestrutura · Dados · Software que resolve problema de verdade</text>
  <rect class="grow" x="150" y="226" width="900" height="2" fill="url(#line)"/>
</svg>
